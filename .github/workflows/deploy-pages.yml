name: Publiceer Zivra op GitHub Pages

on:
  push:
    branches:
      - github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5

      - name: Dependencies installeren
        run: npm ci

      - name: Statische Zivra-site bouwen
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Gebouwde site uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v5
